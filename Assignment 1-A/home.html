<!DOCTYPE html>
<html>
<head>
    <style>
        body 
        {
            font-family: Arial;
            margin: 0;
            background: #b0afaf;
        }
        nav 
        {
            background: #2c3e50;
            padding: 10px;
            color: white;
        }
        nav a 
        {
            color: white;
            margin-left: 30px;
            
        }
        .hero 
        {
            text-align: center;
            padding: 60px;
            background: white;
        }
        input 
        {
            padding: 10px;
            width: 350px;
        }
        button 
        {
            padding: 10px;
            background: #2c3e50;
            color: white;
            border: none;
        }
        .hostels 
        {
            text-align: center;
            padding: 30px;
        }
        .card 
        {
            display: inline-block;
            background: white;
            padding: 20px;
            margin: 10px;
            width: 200px;
        }
        footer 
        {
            text-align: center;
            background: #2c3e50;
            color: white;
            padding: 15px;
        }
    </style>
</head>

<body>

    <nav>
        <b>Hostel Finder</b>
        <a href="#">Home</a>
        <a href="#">Hostels</a>
        <a href="#">Login</a>
    </nav>

    <div class="hero">
        <h1>Find Your Perfect Hostel</h1>
        <p>Find affordable hostels near you.</p>

        <input type="text" placeholder="Enter location">
        <button>Search</button>
    </div>

    <div class="hostels">
        <h2>Popular Hostels</h2>
        <div class="card">
            <h3>Sunrise Hostel</h3>
            <p>📍 Nashik</p>
            <p>₹5000 / month</p>
            <button>View Details</button>
        </div>
        <div class="card">
            <h3>Green Stay</h3>
            <p>📍 Pune</p>
            <p>₹6000 / month</p>
            <button>View Details</button>
        </div>
        <div class="card">
            <h3>Student Home</h3>
            <p>📍 Mumbai</p>
            <p>₹7000 / month</p>
            <button>View Details</button>
        </div>
    </div>
    <footer>
        © 2026 Hostel Finder
    </footer>

</body>
</html>
